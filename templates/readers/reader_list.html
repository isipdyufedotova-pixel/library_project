<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Читатели</title></head>
<body>
<h1>Читатели</h1>
<a href="{% url 'reader_create' %}">Добавить читателя</a>
<ul>
    {% for readers in readers %}
        <li>
            {% if readers.photo %}
                <img src="{{ readers.photo.url }}" alt="{{ readers.name }}" width="80">
            {% endif %}
            <a href="{% url 'reader_detail' readers.pk %}">{{ readers.name }}</a>
            <a href="{% url 'reader_update' readers.pk %}">Редактировать</a>
            <a href="{% url 'reader_delete' readers.pk %}">Удалить</a>
        </li>
    {% empty %}
        <li>Читателей пока нет.</li>
    {% endfor %}
</ul>
</body>
</html>
